---
app-id: io.github.rcalixte.libqt6c-demo
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
command: mdoutliner
finish-args:
  - --device=dri
  - --filesystem=home
  - --share=ipc
  - --share=network
  - --socket=fallback-x11
  - --socket=wayland
  - --talk-name=org.kde.StatusNotifierWatcher
cleanup:
  - '*.a'
  - /include
  - /lib/cmake
  - /lib/pkgconfig
  - /share/doc
  - /share/man
  - /share/pkgconfig
modules:
  - name: mdoutliner
    buildsystem: simple
    build-options:
      append-path: zig
    build-commands:
      - zig build -Doptimize=fast --prefix /app
    sources:
      - type: archive
        sha256: 1cbe9df9f27e6b78d14ccbca43b6703a404ef79ef1c463de901d7f088d4e2026
        url: https://ziglang.org/download/0.17.0/zig-x86_64-linux-0.17.0.tar.xz
        dest: zig
        only-arches: [x86_64]
      - type: archive
        sha256: 9e8d11661d4ae3bd57702a3832781e23ad151dde5798e16a5ccd503f65234ff8
        url: https://ziglang.org/download/0.17.0/zig-aarch64-linux-0.17.0.tar.xz
        dest: zig
        only-arches: [aarch64]
      - type: dir
        path: .
        skip:
          - .flatpak-builder
          - .git
          - .github
          - .zig-cache
          - flatpak
          - zig
          - zig-out
          - zig-pkg
      - type: git
        url: https://github.com/rcalixte/libqt6c.git
        commit: abdaf40367fddc878d91edce10ebba87ecd2d9ce
        dest: zig-pkg/libqt6c-6.8.2-DLhhNhWVEhPigRaR5w2L77bCeSHNVW1IMhHXG_WX5khg
